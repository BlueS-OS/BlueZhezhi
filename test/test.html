<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test · mp4.js</title>
    <style>
      body { font-family: ui-monospace, Consolas, monospace; background: #060708; color: #e9e7e2; padding: 24px; }
      h1 { font-size: 18px; color: #35e6e0; }
      pre { background: #0c0e0f; border: 1px solid #23282b; padding: 14px; overflow: auto; font-size: 12px; }
      video { width: 320px; border: 1px solid #23282b; display: block; margin: 8px 0 20px; }
      .row { display: flex; gap: 24px; flex-wrap: wrap; }
      .ok { color: #35e6e0; }
      .bad { color: #ff6b6b; }
    </style>
  </head>
  <body>
    <h1>Test del parcheador MP4</h1>
    <div id="out">Cargando…</div>

    <script type="module">
      import { inspectMp4, patchMp4, verifyMp4 } from "../src/mp4.js";

      const out = document.getElementById("out");
      const log = (title, data) => {
        const h = document.createElement("h3");
        h.textContent = title;
        const pre = document.createElement("pre");
        pre.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
        out.append(h, pre);
      };

      try {
        const res = await fetch("../test/sample.mp4");
        const original = new Uint8Array(await res.arrayBuffer());
        const size = (n) => `${(n / 1e6).toFixed(2)} MB`;

        const info = inspectMp4(original);
        log(`Original · ${size(original.byteLength)}`, info);

        for (const mode of ["safe", "compat"]) {
          try {
            const { bytes, report } = patchMp4(original, { mode });
            const check = verifyMp4(bytes);

            let playable = "comprobando…";
            const blobUrl = URL.createObjectURL(new Blob([bytes], { type: "video/mp4" }));
            const video = document.createElement("video");
            video.controls = true;
            video.src = blobUrl;
            video.onloadedmetadata = () => {
              playable = `OK · ${video.videoWidth}×${video.videoHeight} · ${video.duration.toFixed(2)}s`;
              const el = document.getElementById(`play-${mode}`);
              if (el) el.textContent = playable;
            };
            video.onerror = () => {
              playable = "ERROR al decodificar";
              const el = document.getElementById(`play-${mode}`);
              if (el) el.textContent = playable;
            };

            log(
              `${mode.toUpperCase()} · ${size(bytes.byteLength)} (${(bytes.byteLength - original.byteLength >= 0 ? "+" : "") + (bytes.byteLength - original.byteLength)} bytes)`,
              { report, verification: { ok: check.ok, issues: check.issues, chunks: check.chunks } },
            );

            const label = document.createElement("p");
            label.innerHTML = `Reproducción: <span id="play-${mode}">${playable}</span>`;
            out.append(label, video);
          } catch (error) {
            log(`${mode.toUpperCase()} · FALLÓ`, `${error.name}: ${error.message}`);
          }
        }

        document.body.classList.add("done");
      } catch (error) {
        log("ERROR GLOBAL", `${error.name}: ${error.message}\n${error.stack ?? ""}`);
      }
    </script>
  </body>
</html>
